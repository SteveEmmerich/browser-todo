name: Verify Browser Todo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Hash the production bundle
        shell: pwsh
        run: Get-ChildItem -Recurse -File dist | Sort-Object FullName | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize
